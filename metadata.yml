Identifier: eos2xeq
Slug: antibiotics-downselection
Status: Ready
Title: Antibiotic downselection criteria based on similarity to known 
  antibiotics
Description: Applies seven structural checks used to triage candidate 
  antibiotics, flagging PAINS and Brenk alerts, Morgan-fingerprint Tanimoto 
  similarity of 0.5 or more to a curated set of 559 known antibacterials, and 
  nitrofuran, fluoroquinolone, carbapenem and beta-lactam motifs. Krishnan and 
  colleagues applied them when searching for de novo antibiotics against 
  Neisseria gonorrhoeae and Staphylococcus aureus, keeping compounds below the 
  similarity cut-off. The activity, cytotoxicity and synthetic accessibility 
  filters of that study are not reproduced here.
