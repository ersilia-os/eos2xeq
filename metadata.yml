Identifier: eos2xeq
Slug: antibiotics-downselection
Status: Ready
Title: Antibiotic downselection criteria based on similarity to known antibiotics
Description: Applies seven structural filters used to triage candidate antibiotics, checking similarity to over 500 known antibacterial agents at a Tanimoto threshold of 0.5 alongside PAINS and Brenk alerts and specific motifs such as nitrofurans. Krishnan and colleagues used criteria of this kind to downselect output from generative antibiotic design, where the volume of proposals makes manual triage impractical. The flags are rule-based rather than learned, so they capture recognised liabilities and precedent, not predicted activity.
